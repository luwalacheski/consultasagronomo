<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Agropecuária - Vendas</title>
    <style>
        /* Estilização básica para exibir os produtos em grade */
        .produtos-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            justify-content: center;
        }

        .produto-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 220px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background-color: #fff;
        }

        .produto-card img {
            max-width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }

        .produto-card h3 {
            color: #2e5a27; /* Verde combinando com o tema agro */
            font-size: 1.2rem;
            margin: 10px 0;
        }

        .produto-card .preco {
            font-weight: bold;
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .btn-comprar {
            background-color: #2e5a27;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .btn-comprar:hover {
            background-color: #1e3d19;
        }
    </style>
</head>
<body>

    <div id="vitrine-produtos" class="produtos-container"></div>

    <script>
        // 1. Simulação dos seus dados (Isso idealmente viria de um Banco de Dados)
        const listaProdutos = [
            {
                id: 1,
                nome: "Adubo NPK 10-10-10",
                categoria: "Adubos e Fertilizantes",
                preco: "R$ 89,90",
                imagem: "https://via.placeholder.com/150" // Substitua pela URL real da foto
            },
            {
                id: 2,
                nome: "Calcário Agrícola 25kg",
                categoria: "Calcário",
                preco: "R$ 45,00",
                imagem: "https://via.placeholder.com/150"
            },
            {
                id: 3,
                nome: "Semente de Milho Híbrido",
                categoria: "Sementes",
                preco: "R$ 230,00",
                imagem: "https://via.placeholder.com/150"
            }
        ];

        // 2. Função para renderizar os produtos na tela automaticamente
        function carregarProdutos() {
            const container = document.getElementById('vitrine-produtos');
            container.innerHTML = ""; // Limpa o container

            listaProdutos.forEach(produto => {
                // Cria o card do produto
                const card = document.createElement('div');
                card.className = 'produto-card';

                card.innerHTML = `
                    <img src="${produto.imagem}" alt="${produto.nome}">
                    <h3>${produto.nome}</h3>
                    <p style="color: gray; font-size: 0.9rem;">${produto.categoria}</p>
                    <div class="preco">${produto.preco}</div>
                    <button class="btn-comprar" onclick="adicionarAoCarrinho(${produto.id})">Comprar</button>
                `;

                // Adiciona o card dentro do container principal
                container.appendChild(card);
            });
        }

        // Função fictícia para o clique do botão
        function adicionarAoCarrinho(id) {
            alert("Produto " + id + " adicionado ao carrinho!");
        }

        // Executa a função assim que a página carrega
        window.onload = carregarProdutos;
    </script>
</body>
</html>
