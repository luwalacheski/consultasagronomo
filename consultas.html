<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Agronômica - Histórico de Lavoura</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2e7d32;
            text-align: center;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #a5d6a7;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #2e7d32;
        }

        button {
            padding: 12px 25px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1b5e20;
        }

        .result-container {
            margin-top: 20px;
        }

        .produtor-card {
            background-color: #e8f5e9;
            border-left: 5px solid #2e7d32;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2e7d32;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .no-result {
            text-align: center;
            color: #d32f2f;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Portal de Consultas Agronômicas</h1>
    
    <div class="search-box">
        <input type="text" id="inputNome" placeholder="Digite seu nome completo (ex: João Silva)...">
        <button onclick="buscarHistorico()">Pesquisar</button>
    </div>

    <div id="resultado" class="result-container"></div>
</div>

<script>
    // Dados simulados de produtores e histórico de lavoura
    const dadosAgronomicos = [
        {
            nome: "João Silva",
            propriedade: "Fazenda Santa Maria",
            historico: [
                { ano: 2023, cultura: "Soja", sacas: 3200, parecer: "Boa gestão de solo, infestação de pragas controlada." },
                { ano: 2024, cultura: "Milho", sacas: 4100, parecer: "Aplicação de nitrogênio eficiente, ótimo rendimento." },
                { ano: 2025, cultura: "Soja", sacas: 3500, parecer: "Período de seca moderada impactou levemente a colheita." }
            ]
        },
        {
            nome: "Maria Oliveira",
            propriedade: "Sítio Vista Alegre",
            historico: [
                { ano: 2023, cultura: "Café", sacas: 850, parecer: "Necessidade de correção de acidez no Solo B." },
                { ano: 2024, cultura: "Café", sacas: 1100, parecer: "Resposta positiva à adubação foliar realizada." }
            ]
        }
    ];

    function buscarHistorico() {
        const termoBusca = document.getElementById('inputNome').value.trim().toLowerCase();
        const containerResultado = document.getElementById('resultado');
        
        containerResultado.innerHTML = "";

        if (termoBusca === "") {
            containerResultado.innerHTML = "<p class='no-result'>Por favor, digite um nome para pesquisar.</p>";
            return;
        }

        // Filtra o produtor pelo nome
        const produtorEncontrado = dadosAgronomicos.find(p => p.nome.toLowerCase().includes(termoBusca));

        if (produtorEncontrado) {
            let htmlHTML = `
                <div class="produtor-card">
                    <h2>Produtor: ${produtorEncontrado.nome}</h2>
                    <p><strong>Propriedade:</strong> ${produtorEncontrado.propriedade}</p>
                </div>
                <h3>Histórico de Consultas e Produção</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Ano</th>
                            <th>Cultura</th>
                            <th>Sacas Colhidas</th>
                            <th>Parecer Agronômico</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            produtorEncontrado.historico.forEach(item => {
                htmlHTML += `
                    <tr>
                        <td>${item.ano}</td>
                        <td>${item.cultura}</td>
                        <td><strong>${item.sacas} sc</strong></td>
                        <td>${item.parecer}</td>
                    </tr>
                `;
            });

            htmlHTML += `
                    </tbody>
                </table>
            `;

            containerResultado.innerHTML = htmlHTML;
        } else {
            containerResultado.innerHTML = "<p class='no-result'>Nenhum registro encontrado para este nome.</p>";
        }
    }
</script>

</body>
</html>
