<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForte - Sistema de Laudos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background-color: #11783b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            font-size: 14px;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
        }

        .nav-links a.active {
            color: #ffffff;
            font-weight: 600;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .icon-header {
            color: #11783b;
            font-size: 45px;
            margin-bottom: 15px;
        }

        .login-card h2 {
            font-size: 20px;
            color: #212529;
            margin-bottom: 5px;
        }

        .login-card p {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            color: #495057;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #11783b;
        }

        .btn-submit {
            width: 100%;
            background-color: #11783b;
            color: white;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: #0d5c2d;
        }

        /* Mensagem de Erro (Corrigida - Inicia Oculta) */
        .message {
            margin-top: 15px;
            font-size: 13px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .message.error {
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }

        /* Painel Dashboard */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .dashboard h2 {
            color: #11783b;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
        }

        /* Layout Dinâmico da Pasta Autorizada */
        .pasta-container {
            background-color: #e8f5e9;
            border: 2px dashed #11783b;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .pasta-container i {
            font-size: 45px;
            color: #11783b;
        }

        .pasta-info h3 {
            color: #1b5e20;
            font-size: 18px;
            text-transform: capitalize;
        }

        .pasta-info p {
            font-size: 13px;
            color: #43a047;
            margin-top: 2px;
        }

        /* Itens de Consulta */
        .consulta-item {
            background: #f8f9fa;
            padding: 15px;
            border-left: 4px solid #11783b;
            margin-bottom: 15px;
            border-radius: 0 6px 6px 0;
        }

        .consulta-item h4 {
            color: #212529;
            font-size: 16px;
        }

        .consulta-item p {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <i class="fas fa-leaf"></i> AgroForte
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active">Consultas Agronômicas</a></li>
        </ul>
    </nav>

    <div class="main-container">

        <div class="login-card" id="loginCard">
            <div class="icon-header">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2>Acesso ao Sistema</h2>
            <p>Insira seus dados para puxar seus laudos e pastas.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" placeholder="Ex: luh walacheski" required>
                </div>

                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>

                <div class="form-group">
                    <label>Tipo de Perfil</label>
                    <select id="perfil" required>
                        <option value="Produtor">Produtor</option>
                        <option value="Agrônomo">Agrônomo</option>
                        <option value="Técnico">Técnico</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-folder-open"></i> Puxar Minha Pasta
                </button>
            </form>

            <div id="feedbackMsg" class="message error"></div>
        </div>

        <div class="dashboard" id="dashboardPanel">
            <h2><i class="fas fa-server"></i> Repositório de Documentos</h2>
            
            <div id="pastaDestino"></div>

            <div id="listaConsultas"></div>
        </div>

    </div>

    <script>
        // 1. Cadastro de Usuários Permitidos no Sistema
        const usuariosCadastrados = [
            { nome: "luh walacheski", cpf: "123.456.789-00", perfil: "Produtor" },
            { nome: "Carlos Silva", cpf: "987.654.321-11", perfil: "Agrônomo" },
            { nome: "Ana Costa", cpf: "456.789.123-22", perfil: "Técnico" },
            { nome: "Pedro Alvares", cpf: "111.222.333-44", perfil: "Produtor" } // Produtor SEM consultas cadastradas
        ];

        // 2. Banco de Consultas Agronômicas Global (Filtrado por CPF)
        const bancoConsultas = [
            { 
                cpfDono: "123.456.789-00", 
                titulo: "Laudo Técnico #2026-01 (Solo)", 
                detalhe: "Análise físico-química de solo estruturada para a janela de plantio da safra atual. Recomendação de calagem aplicada." 
            },
            { 
                cpfDono: "123.456.789-00", 
                titulo: "Relatório de Manejo Integrado de Pragas", 
                detalhe: "Monitoramento de talhões realizado em Junho de 2026. Controle biológico efetivo sem necessidade de intervenção química." 
            },
            { 
                cpfDono: "987.654.321-11", 
                titulo: "Agenda de Vistorias Técnicas da Região Sul", 
                detalhe: "Relatório gerencial consolidado contendo o cronograma de saídas de campo semanais do profissional." 
            }
        ];

        // Máscara automática de CPF
        const cpfInput = document.getElementById('cpf');
        cpfInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 3) value = value.substring(0,3) + '.' + value.substring(3);
            if (value.length > 7) value = value.substring(0,7) + '.' + value.substring(7);
            if (value.length > 11) value = value.substring(0,11) + '-' + value.substring(11,13);
            e.target.value = value;
        });

        // Evento principal de Submissão do Formulário
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nomeDigitado = document.getElementById('nome').value.trim();
            const cpfDigitado = document.getElementById('cpf').value.trim();
            const perfilSelecionado = document.getElementById('perfil').value;
            const feedbackMsg = document.getElementById('feedbackMsg');

            // Validação Inicial: Confere se os três dados batem com a lista de cadastros
            const usuarioValido = usuariosCadastrados.find(user => 
                user.nome.toLowerCase() === nomeDigitado.toLowerCase() &&
                user.cpf === cpfDigitado &&
                user.perfil === perfilSelecionado
            );

            if (!usuarioValido) {
                feedbackMsg.innerText = "Acesso Negado: Os dados inseridos não coincidem com nenhum cadastro ativo.";
                feedbackMsg.style.display = 'block';
                return;
            }

            // Filtra as consultas agronômicas vinculadas a este CPF específico
            const consultasDoUsuario = bancoConsultas.filter(consulta => consulta.cpfDono === cpfDigitado);

            // Validação de Regra de Negócio: Produtores precisam ter consultas no histórico
            if (perfilSelecionado === "Produtor" && consultasDoUsuario.length === 0) {
                feedbackMsg.innerText = "Acesso Negado: O perfil de Produtor só tem acesso autorizado se possuir um histórico de consultas registrado.";
                feedbackMsg.style.display = 'block';
                return;
            }

            // Se passou por tudo, oculta o erro e prepara o Painel
            feedbackMsg.style.display = 'none';

            // --- PROCESSAMENTO E MONTAGEM DINÂMICA DA PASTA ---
            const pastaDestino = document.getElementById('pastaDestino');
            const listaConsultas = document.getElementById('listaConsultas');

            // Cria o HTML da pasta contendo o nome do usuário validado
            pastaDestino.innerHTML = `
                <div class="pasta-container">
                    <i class="fas fa-folder-open"></i>
                    <div class="pasta-info">
                        <h3>Pasta: ${usuarioValido.nome}</h3>
                        <p><i class="fas fa-check-circle"></i> Repositório de Documentos Autorizado (${usuarioValido.perfil})</p>
                    </div>
                </div>
            `;

            // Limpa consultas exibidas anteriormente (caso existam)
            listaConsultas.innerHTML = "";

            // Injeta dinamicamente cada laudo técnico pertencente ao usuário no container
            consultasDoUsuario.forEach(consulta => {
                const itemHTML = `
                    <div class="consulta-item">
                        <h4><i class="fas fa-file-invoice"></i> ${consulta.titulo}</h4>
                        <p>${consulta.detalhe}</p>
                    </div>
                `;
                listaConsultas.innerHTML += itemHTML;
            });

            // Oculta a caixa de login e exibe o dashboard atualizado
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('dashboardPanel').style.display = 'block';
        });
    </script>
</body>
</html>
